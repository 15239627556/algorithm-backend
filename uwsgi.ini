[uwsgi]
; ========== 基础配置 ==========
; 项目根目录（uwsgi 启动时切换到此目录）
chdir           = %d
; WSGI 模块：app.py 中的 Flask 实例名为 app
module          = app:app

; Python 虚拟环境（如使用 venv/conda，取消注释并修改路径）
;home            = %d/venv
;pythonpath      = %d

; ========== 进程/线程模型：1 进程 16 线程 ==========
; 不使用 master（单进程直接运行 worker）。如需平滑重启可改为 master=true
master          = true
processes       = 1
threads         = 32
enable-threads  = true
single-interpreter = true

; ========== 网络监听 ==========
; 对外 HTTP 端口（与 config.py 中 FLASK_PORT 保持一致）
http            = 0.0.0.0:3090
; 若前置 Nginx 走 uwsgi 协议，可改用下一行并注释掉 http
;socket          = 0.0.0.0:3090

; 连接队列与缓冲
listen          = 256
buffer-size     = 65535
; 单次请求超时（秒），算法接口可能耗时较长，适当放大
harakiri        = 600
http-timeout    = 600
socket-timeout  = 600
; 允许上传大文件
limit-post      = 1073741824
post-buffering  = 8192

; ========== 进程管理 ==========
; pid 文件与主控 socket
pidfile         = %d/logs/uwsgi.pid
; 优雅退出
die-on-term     = true
vacuum          = true
lazy-apps       = true

; ========== 日志 ==========
; uwsgi 自身日志（与 Flask 的 logs/app.log 分开）
logto           = %d/logs/uwsgi.log
log-maxsize     = 10485760
log-reopen      = true
disable-logging = false

; ========== 其他 ==========
; 防止 Python 输出缓冲，便于实时查看日志
env             = PYTHONUNBUFFERED=1
; 解决某些环境下 import 找不到 backend/algorithms/project 的问题（app.py 内部已 sys.path.append，这里作为双保险）
pythonpath      = %d
pythonpath      = %d/backend
pythonpath      = %d/algorithms
pythonpath      = %d/project
